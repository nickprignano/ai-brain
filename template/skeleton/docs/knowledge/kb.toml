# This KB's identity: the only settings that differ between KBs that share the family scripts.
# build.py writes llms.txt and orders topics from it; sources.py sends user_agent to the APIs it calls.
# Change these for your KB. Keep topic_order in step with the topic list in schema/page.schema.json.

name = "my-kb"
title = "project knowledge base"
tagline = "A living knowledge base of findings, gotchas and decisions for this project."
user_agent = "my-kb-curator"
topic_order = ["overview", "getting-started", "troubleshooting", "roadmap", "curation"]

# Decision 0011: what the Stop hook does when code changed without a KB entry ("block", "warn" or
# "off"). The kb-capture PR check runs either way. capture_ignore lists more paths that aren't code:
# here, the private layer, so notes don't count as code. setup.py --public empties it.
capture_hook = "block"
capture_ignore = ["notes/**", "outbox/**", "hub.toml"]

# Decision 0014: "on" lets kb-auto-merge turn on GitHub's auto-merge for a PR from the owner whose
# every changed file matches auto_merge_paths. Decisions, workflows, scripts, settings and code never
# qualify, whatever this says. The owner also flips "Allow auto-merge" and the required checks.
auto_merge = "off"
auto_merge_paths = ["docs/knowledge/**", "llms.txt"]

# Decision 0016, step 6: the secrets-touch PR comment flags any host not in egress_allow (on top of
# localhost and example hosts), and doesn't scan secrets_touch_ignore.
egress_allow = []
secrets_touch_ignore = []

# Structured data files listed in llms.txt, in order. A file that doesn't exist is skipped.
[[data]]
name = "Known errors"
path = "troubleshooting/known-errors.yaml"
text = "symptom, cause, fix and source for errors hit in this project"

[[data]]
name = "Field reports"
path = "field-reports.yaml"
text = "what worked or broke when someone followed the KB"

[[data]]
name = "Experts study"
path = "experts.yaml"
text = "people the KB follows, with scores, evidence and the feeds watched"

[[data]]
name = "Family"
path = "family.yaml"
text = "the sibling knowledge bases and the format version each follows"
