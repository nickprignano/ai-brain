name: Knowledge base feedback
description: Tell us what worked, broke, went out of date or is missing in docs/knowledge/.
title: "KB feedback: "
labels: [kb-feedback]
body:
  - type: markdown
    attributes:
      value: |
        This repo is public. Don't paste API keys, account, org or workspace IDs, user names, domains,
        emails, IP addresses or secrets. A maintainer reviews every report before it reaches the KB.
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - Worked as described
        - Broke or gave the wrong result
        - Outdated (something changed upstream)
        - Missing (the KB should cover this)
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: Path under docs/knowledge/, for example claude-api/README.md
      placeholder: claude-api/README.md
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: One or two sentences.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Tool and provider versions involved, if relevant.
      placeholder: Claude Code 2.1.0, anthropic 0.69.0
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Error text, a log excerpt or a link, with names and IDs removed.
  - type: checkboxes
    id: public-safe
    attributes:
      label: Public-safe
      options:
        - label: I removed API keys, account and workspace IDs, names, domains, emails, IP addresses and secrets.
          required: true
