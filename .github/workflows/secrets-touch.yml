name: secrets-touch

# Decision 0016, step 6: a session that can deploy code can leak a key without seeing it. This lists
# the lines in a pull request that read a secret, use the whole environment, log or return something
# secret-named, or call a host not on the egress allowlist, in one PR comment, so the owner reads
# them. It's a prompt to read, not a gate: it never fails a PR, and it isn't a required check.
#
# pull_request_target runs this file and scripts/kb/secrets_touch.py from the base branch, so a PR
# can't quiet the check it's being read by. The PR's commits are fetched as git objects and diffed;
# nothing from the PR is checked out or run.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: secrets-touch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secrets-touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lines to read
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          : > "$RUNNER_TEMP/comment.md"
          if [ ! -f scripts/kb/secrets_touch.py ]; then exit 0; fi
          git fetch --no-tags --quiet origin "+refs/pull/$PR/head:refs/remotes/pr/head"
          python3 scripts/kb/secrets_touch.py --base "$BASE" --head pr/head \
            --markdown "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
      # One comment per PR, edited in place on each push, posted even when nothing is flagged so a
      # missing or stale comment means the check didn't run on that commit.
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- secrets-touch -->"))) | .id' | head -n 1)
          if [ -s "$RUNNER_TEMP/comment.md" ]; then
            body=$(cat "$RUNNER_TEMP/comment.md")
          else
            body=$(printf '<!-- secrets-touch -->\n### Secrets touch: nothing to read at `%s`\n' "${HEAD_SHA:0:12}")
          fi
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
