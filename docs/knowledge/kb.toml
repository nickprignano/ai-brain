# This KB's identity: the only settings that differ between KBs that share the family scripts.
# build.py writes llms.txt and orders topics from it; sources.py sends user_agent to the APIs it calls.

name = "ai-brain"
title = "AI research knowledge base"
tagline = "A living knowledge base of findings, gotchas and decisions about the Claude API, agents and AI tooling, shared by a family of sibling knowledge bases that use the same format."
user_agent = "ai-brain-kb-curator"
topic_order = ["overview", "claude-api", "agents", "prompting", "evals", "privacy-and-safety", "platforms",
               "learning", "troubleshooting", "roadmap", "curation"]

# Decision 0011: what the Stop hook does when code changed without a KB entry ("block", "warn" or
# "off"). The kb-capture PR check runs either way. capture_ignore lists more paths that aren't code.
capture_hook = "block"
capture_ignore = []

# Decision 0013: "on" lets kb-auto-merge turn on GitHub's auto-merge for a PR from the owner whose
# every changed file matches auto_merge_paths. Decisions, workflows, scripts, settings and code never
# qualify, whatever this says. The owner also flips "Allow auto-merge" and the required checks.
auto_merge = "off"  # turned on by its own PR once the repo settings in decision 0013 are in place
auto_merge_paths = ["docs/**", "README.md", "llms.txt"]

# Structured data files listed in llms.txt, in order. A file that doesn't exist is skipped.
[[data]]
name = "Known errors"
path = "troubleshooting/known-errors.yaml"
text = "symptom, cause, fix and source for errors hit with the Claude API and AI tooling"

[[data]]
name = "Upstream asks"
path = "anthropic/upstream.yaml"
text = "gaps and asks for Anthropic's API, SDKs and tools, with evidence and status"

[[data]]
name = "Field reports"
path = "field-reports.yaml"
text = "what worked or broke when someone followed the KB"

[[data]]
name = "Experts study"
path = "experts.yaml"
text = "people the KB follows, with scores, evidence and the feeds watched"

[[data]]
name = "Family"
path = "family.yaml"
text = "the sibling knowledge bases and the format version each follows"
