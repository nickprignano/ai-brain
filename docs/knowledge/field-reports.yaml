    and the PR's 'opened' kb-capture run fails before the label or KB: line is added, leaving one red
    run beside the green rerun.
  versions: capture_check.py from the template export, 2026-10-19
  evidence: >-
    The adopting PR's runs: kb-capture failed on opened, no-kb was applied three seconds later, and the
    reruns passed on the same head; the no-kb label carries GitHub's default color and no description.
  issue: 54
